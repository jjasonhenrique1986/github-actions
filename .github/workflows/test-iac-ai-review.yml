name: Testes da iac-ai-review

# Só pull_request: a action recusa outros eventos
on:
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rodar o actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  sem-aws:
    # PR sem mudanças de infraestrutura: a action não pode assumir a role nem chamar o modelo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: action
        uses: ./iac-ai-review
        with:
          role-to-assume: arn:aws:iam::111122223333:role/nao-existe
          base-ref: HEAD
          comment: "false"

      - name: Conferir o resultado
        env:
          REVIEW_FILE: ${{ steps.action.outputs.review-file }}
        run: |
          cat "$REVIEW_FILE"
          grep -q "Nenhuma mudança em Terraform ou YAML" "$REVIEW_FILE"
          if [ -n "${AWS_ACCESS_KEY_ID:-}" ]; then
            echo "::error::A action configurou credenciais da AWS sem mudanças de infraestrutura."
            exit 1
          fi

  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iac-ai-review
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Rodar os testes
        run: pytest -q

  scanner-invalido:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: action
        continue-on-error: true
        uses: ./iac-ai-review
        with:
          role-to-assume: arn:aws:iam::111122223333:role/nao-existe
          scanners: checkov,tfsec
          base-ref: HEAD
          comment: "false"

      - name: Conferir que a action falhou
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::Esperava falha com scanner desconhecido, veio $OUTCOME."
            exit 1
          fi

  com-aws:
    # Forks não recebem o token OIDC
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Criar um commit local com o fixture
        # O diff revisado é sempre o fixture, não importa o que o PR altera
        run: |
          git config user.name "teste"
          git config user.email "teste@example.com"
          mkdir -p fixture-pr
          cp tests/fixtures/sg-ssh-aberto.tf fixture-pr/main.tf
          # Manifest que o checkov não aponta, mas o Trivy e o kube-linter sim
          cp iac-ai-review/examples/k8s/rbac-cluster-admin.yaml fixture-pr/rbac.yaml
          git add fixture-pr
          git commit -q -m "fixture"

      - id: action
        uses: ./iac-ai-review
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          model-id: ${{ vars.MODEL_ID }}
          base-ref: HEAD~1

      - name: Conferir o resultado
        env:
          REVIEW_FILE: ${{ steps.action.outputs.review-file }}
        run: |
          cat "$REVIEW_FILE"
          grep -q "Risco geral" "$REVIEW_FILE"
          grep -q "Scanners: checkov, trivy, kube-linter, kubeconform" "$REVIEW_FILE"
          if grep -q "não rodaram" "$REVIEW_FILE"; then
            echo "::error::Algum scanner não rodou."
            exit 1
          fi
