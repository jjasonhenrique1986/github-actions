# Exemplo propositalmente com problemas para testar a revisão:
# painel administrativo publicado na internet por HTTP, sem TLS e sem nenhuma autenticação na frente.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin
  namespace: app
spec:
  ingressClassName: nginx
  rules:
    - host: admin.exemplo.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin
                port:
                  number: 8080
