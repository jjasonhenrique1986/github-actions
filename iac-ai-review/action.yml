name: Revisão de IaC com IA
description: >-
  Revisa as mudanças de Terraform e Kubernetes de um Pull Request com IA no Amazon Bedrock e comenta
  no PR. Roda o iac-ai-reviewer (https://github.com/jjasonhenrique1986/iac-ai-reviewer) numa versão fixa.
author: Jason Henrique

inputs:
  role-to-assume:
    description: ARN da role IAM do repositório, assumida por OIDC. Guarde como secret.
    required: true
  aws-region:
    description: Região do Amazon Bedrock.
    required: false
    default: us-east-1
  model-id:
    description: Modelo usado na revisão (MODEL_ID do iac-ai-reviewer). Vazio usa o padrão do revisor.
    required: false
    default: ""
  reviewer-version:
    description: Tag ou SHA do iac-ai-reviewer.
    required: false
    default: v1.0.0
  base-ref:
    description: Ref base do diff. Vazio usa origin/<branch base do PR>.
    required: false
    default: ""
  checkov:
    description: Roda o checkov e envia o resultado ao modelo (true ou false).
    required: false
    default: "true"
  checkov-version:
    description: Versão do checkov.
    required: false
    default: "3.3.29"
  comment:
    description: Publica a revisão como comentário no PR (true ou false).
    required: false
    default: "true"

outputs:
  review-file:
    description: Caminho do arquivo Markdown com a revisão.
    value: ${{ steps.review.outputs.review-file }}

runs:
  using: composite
  steps:
    - name: Validar o contexto
      id: context
      shell: bash
      env:
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        REVIEWER_VERSION: ${{ inputs.reviewer-version }}
      run: |
        if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
          echo "::error::A action iac-ai-review roda só em eventos pull_request (evento atual: $GITHUB_EVENT_NAME)."
          exit 1
        fi
        if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" != "false" ]; then
          echo "::error::O repositório precisa do histórico completo. Use actions/checkout com fetch-depth: 0."
          exit 1
        fi
        base="${INPUT_BASE_REF:-origin/$GITHUB_BASE_REF}"
        if ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
          echo "::error::Ref base '$base' não encontrada."
          exit 1
        fi
        echo "base=$base" >> "$GITHUB_OUTPUT"
        echo "Versão do iac-ai-reviewer: $REVIEWER_VERSION"

    - name: Detectar mudanças de infraestrutura
      id: changes
      shell: bash
      env:
        BASE: ${{ steps.context.outputs.base }}
      run: |
        # Os mesmos padrões do iac-ai-reviewer (FILE_PATTERNS)
        files="$(git diff --name-only "$BASE...HEAD" -- '*.tf' '*.tfvars' '*.yaml' '*.yml')"
        if [ -n "$files" ]; then
          echo "has-changes=true" >> "$GITHUB_OUTPUT"
          echo "Arquivos de infraestrutura alterados:"
          echo "$files"
        else
          echo "has-changes=false" >> "$GITHUB_OUTPUT"
          echo "Nenhuma mudança de infraestrutura: a AWS não será chamada."
        fi

    - name: Buscar o iac-ai-reviewer
      id: reviewer
      shell: bash
      env:
        REVIEWER_VERSION: ${{ inputs.reviewer-version }}
      run: |
        # Fora do workspace: o código do revisor não entra no diff nem no checkov do repositório
        dir="$RUNNER_TEMP/iac-ai-reviewer"
        rm -rf "$dir" && mkdir -p "$dir" && cd "$dir"
        git init -q
        git remote add origin https://github.com/jjasonhenrique1986/iac-ai-reviewer.git
        if ! git fetch -q --depth 1 origin "$REVIEWER_VERSION"; then
          echo "::error::Versão '$REVIEWER_VERSION' do iac-ai-reviewer não encontrada."
          exit 1
        fi
        git checkout -q FETCH_HEAD
        echo "iac-ai-reviewer $REVIEWER_VERSION ($(git rev-parse HEAD))"
        echo "dir=$dir" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Instalar o revisor
      shell: bash
      env:
        DIR: ${{ steps.reviewer.outputs.dir }}
      run: |
        python -m venv "$RUNNER_TEMP/venv-reviewer"
        "$RUNNER_TEMP/venv-reviewer/bin/pip" install -q -r "$DIR/reviewer/requirements.txt"

    - name: Rodar o checkov
      if: steps.changes.outputs.has-changes == 'true' && inputs.checkov == 'true'
      shell: bash
      env:
        CHECKOV_VERSION: ${{ inputs.checkov-version }}
      run: |
        # venv próprio: instalado junto com o revisor, o checkov pode rebaixar o boto3
        python -m venv "$RUNNER_TEMP/venv-checkov"
        "$RUNNER_TEMP/venv-checkov/bin/pip" install -q "checkov==$CHECKOV_VERSION"
        "$RUNNER_TEMP/venv-checkov/bin/checkov" -d . --framework terraform kubernetes \
          --compact --quiet --soft-fail > "$RUNNER_TEMP/checkov.txt"

    - name: Configurar credenciais da AWS
      if: steps.changes.outputs.has-changes == 'true'
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        mask-aws-account-id: true
        aws-region: ${{ inputs.aws-region }}

    - name: Revisar com IA
      id: review
      shell: bash
      env:
        DIR: ${{ steps.reviewer.outputs.dir }}
        BASE: ${{ steps.context.outputs.base }}
        MODEL_ID: ${{ inputs.model-id }}
        AWS_REGION: ${{ inputs.aws-region }}
      run: |
        out="$RUNNER_TEMP/review.md"
        "$RUNNER_TEMP/venv-reviewer/bin/python" "$DIR/reviewer/review.py" \
          --base "$BASE" --checkov "$RUNNER_TEMP/checkov.txt" --output "$out"
        echo "review-file=$out" >> "$GITHUB_OUTPUT"

    - name: Comentar no PR
      if: inputs.comment == 'true'
      uses: marocchino/sticky-pull-request-comment@v3.0.5
      with:
        header: ai-iac-review
        path: ${{ steps.review.outputs.review-file }}

branding:
  icon: shield
  color: blue
