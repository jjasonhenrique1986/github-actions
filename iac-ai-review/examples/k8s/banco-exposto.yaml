# Exemplo propositalmente com problemas para testar a revisão:
# PostgreSQL exposto por um LoadBalancer público e senha num ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: app
data:
  POSTGRES_USER: app
  POSTGRES_PASSWORD: SenhaFixa123!
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: app
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: postgres-config
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: app
spec:
  type: LoadBalancer
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
